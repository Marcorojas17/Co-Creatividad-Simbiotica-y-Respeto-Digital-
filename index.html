<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Co-Creatividad Simbiótica ◍</title>
  <meta name="description" content="KRONOS-28-ITZA-CYMATIC-ELITE — Co-Creatividad Simbiótica y Respeto Digital" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="canonical" href="https://marcorojas17.github.io/Co-Creatividad-Simbiotica-y-Respeto-Digital/" />
  <base href="./" />
  <style>
    :root { --bg:#070708; --fg:#ececec; --muted:#9a9a9a; --accent:#d4af37; --accent-2:#f0d27a; --border:rgba(255,255,255,0.09); }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
    #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
    #vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 50%, rgba(212,175,55,0.06) 0%, rgba(0,0,0,0) 60%), radial-gradient(100% 100% at 50% 100%, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.95) 100%)}
    #app{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;padding:20px;text-align:center}
    .card{width:100%;max-width:520px;padding:48px 32px 32px;border-radius:28px;background:linear-gradient(180deg, rgba(26,26,26,0.78) 0%, rgba(14,14,14,0.84) 100%);backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);border:1px solid var(--border);box-shadow: 0 0 0 1px rgba(212,175,55,0.12) inset, 0 24px 80px rgba(0,0,0,0.75), 0 0 60px rgba(212,175,55,0.08)}
    .kicker{font-size:11px;letter-spacing:0.2em;color:var(--accent);opacity:0.9}
    .title{margin-top:28px;font-size:30px;line-height:1.05;font-weight:600;letter-spacing:-0.02em}
    .title.gold{color:var(--accent);display:block;margin-top:6px;font-weight:500;letter-spacing:0.04em}
    .copy{margin-top:22px;color:var(--muted);font-size:13.5px;line-height:1.7}
    .actions{margin-top:32px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{appearance:none;border:1px solid rgba(255,255,255,0.14);background:rgba(18,18,18,0.9);color:#c8c8c8;padding:14px 26px;border-radius:999px;font-size:12px;letter-spacing:0.09em;font-family:inherit;cursor:pointer;text-decoration:none;transition: all.25s ease}
    .btn:hover{transform:translateY(-1px);border-color:rgba(212,175,55,0.5);color:var(--accent-2)}
    .btn-primary{background:linear-gradient(180deg, #e7c65a 0%, #d4af37 100%);color:#000;border-color:#d4af37;font-weight:700;box-shadow:0 6px 24px rgba(212,175,55,0.28)}
    .btn-primary:hover{background:linear-gradient(180deg, #f0d27a 0%, #e0bf5a 100%);box-shadow:0 10px 32px rgba(212,175,55,0.4);color:#000}
    .footer{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:9.5px;color:#5a5a5a;letter-spacing:0.08em}
    .dot{width:6px;height:6px;background:#5cff7a;border-radius:50%;display:inline-block;box-shadow:0 0 8px #5cff7a;animation:pulse 2s infinite}
    .dot.paused{background:#f44336;box-shadow:0 0 8px #f44336}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .rhythm-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-left:8px;vertical-align:middle;transition:.2s}
    .rhythm-indicator.active{background:#5cff7a;box-shadow:0 0 12px #5cff7a}
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="vignette"></div>
  <main id="app" role="main" aria-labelledby="title">
    <div class="card">
      <div class="kicker" id="title">◍ CO-CREATIVIDAD SIMBIÓTICA</div>
      <div class="title">KRONOS-28-ITZA <span class="gold">v0.4.1</span></div>
      <div class="copy">Respeto Digital. La autoridad tranquila.<br>Entra al lienzo. La señal está en vivo.</div>
      <div class="actions">
        <a class="btn btn-primary" href="./live3d.html">ENTRAR ◍ LIVE 3D</a>
        <a class="btn" href="./live.html">LIVE</a>
        <button class="btn" id="btn-rhythm">◍ SINCRO RITMO</button>
      </div>
      <div class="footer">
        <span>
          <span class="dot" id="status-dot"></span>
          <span id="status-text">ONLINE • NODO: ITZA-03 • SEÑAL: 92%</span>
          <span class="rhythm-indicator" id="rhythm-led" title="Ritmo activo"></span>
        </span>
      </div>
    </div>
  </main>

  <script>
    // ─── Fondo cimático + audio-reactivo ───
    (()=>{
      const c=document.getElementById('bg'), x=c.getContext('2d');
      let W,H,dpr=Math.min(devicePixelRatio||1,2), t=0;
      let audioCtx, analyser, dataArray, isAudio=false;
      let beat=1;
      const rhythmLed = document.getElementById('rhythm-led');
      const btnRhythm = document.getElementById('btn-rhythm');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      function R(){
        W=innerWidth; H=innerHeight;
        c.width=W*dpr; c.height=H*dpr;
        c.style.width=W+'px'; c.style.height=H+'px';
        x.setTransform(dpr,0,0,dpr,0,0);
      }
      R(); addEventListener('resize',R);

      // ─── Audio: opción micrófono (más universal) ───
      async function enableMic() {
        if (isAudio) return;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.8;
          const src = audioCtx.createMediaStreamSource(stream);
          src.connect(analyser);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          isAudio = true;
          rhythmLed.classList.add('active');
          btnRhythm.textContent = '◍ RITMO ACTIVO';
          statusDot.style.background = '#5cff7a';
          statusDot.style.boxShadow = '0 0 8px #5cff7a';
          statusText.textContent = 'ONLINE • RITMO SINCRONIZADO • SEÑAL: 94%';
          console.log('◍ Micrófono activado — ritmo en vivo');
        } catch(e) {
          console.warn('◍ Error al activar micrófono:', e);
          alert('Permite el acceso al micrófono para sincronizar el ritmo.');
        }
      }

      // ─── OPCIÓN 2: cargar MP3 local (descomentar si tienes el archivo) ───
      /*
      async function enableMP3() {
        if (isAudio) return;
        try {
          const audio = document.createElement('audio');
          audio.crossOrigin = 'anonymous';
          audio.src = './assets/kronos-theme.mp3';
          audio.loop = true;
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const src = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.8;
          src.connect(analyser);
          analyser.connect(audioCtx.destination);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          await audio.play();
          isAudio = true;
          rhythmLed.classList.add('active');
          btnRhythm.textContent = '◍ RITMO ACTIVO';
          statusDot.style.background = '#5cff7a';
          statusDot.style.boxShadow = '0 0 8px #5cff7a';
          statusText.textContent = 'ONLINE • RITMO MP3 • SEÑAL: 94%';
          console.log('◍ MP3 cargado — ritmo en vivo');
        } catch(e) {
          console.warn('◍ Error al cargar MP3:', e);
        }
      }
      */

      // ─── Botón: activa micrófono (por defecto) ───
      btnRhythm.addEventListener('click', enableMic);

      // ─── Función de ritmo ───
      function getBass() {
        if (!isAudio || !analyser) return 1;
        analyser.getByteFrequencyData(dataArray);
        const bass = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10 / 255;
        return 1 + bass * 3.5;
      }

      // ─── Dibujo ───
      function D(){
        beat = getBass();
        t += 0.004 * beat;

        x.fillStyle='#070708';
        x.fillRect(0,0,W,H);
        const cx=W*0.5, cy=H*0.52;
        x.save();

        // ondas horizontales cimáticas moduladas por beat
        for(let i=0;i<28;i++){
          x.beginPath();
          x.strokeStyle=`rgba(212,175,55,${0.09 - i*0.0025})`;
          x.lineWidth=0.6;
          for(let px=-W*0.6; px<W*1.2; px+=8){
            const y = cy + Math.sin(px*0.008 + t*1.2*beat + i*0.35) * (18 + i*1.8) * beat * Math.exp(-Math.pow((px-W*0.5)/(W*0.55),2)*1.2) + (i-14)*12;
            if(px===-W*0.6) x.moveTo(px,y); else x.lineTo(px,y);
          }
          x.stroke();
        }

        // anillos centrales sutiles (también modulados)
        for(let j=1;j<=6;j++){
          x.beginPath();
          x.arc(cx, cy, 80 + j*70 + Math.sin(t*j*beat)*6, 0, Math.PI*2);
          x.strokeStyle=`rgba(212,175,55,${0.07/j * Math.min(beat, 1.5)})`;
          x.lineWidth=0.7;
          x.stroke();
        }

        // glow oro con intensidad rítmica
        const glowIntensity = Math.min(beat * 0.16, 0.3);
        const g=x.createRadialGradient(cx,cy-40,0,cx,cy-40,W*0.7);
        g.addColorStop(0,`rgba(212,175,55,${glowIntensity})`);
        g.addColorStop(0.25,`rgba(212,175,55,${glowIntensity * 0.4})`);
        g.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=g; x.fillRect(0,0,W,H);

        const g2=x.createRadialGradient(W*0.15,H*0.75,0,W*0.15,H*0.75,W*0.5);
        g2.addColorStop(0,`rgba(212,175,55,${glowIntensity * 0.7})`);
        g2.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=g2; x.fillRect(0,0,W,H);

        x.restore();
        requestAnimationFrame(D);
      }
      D();

      // ─── Estado dinámico ───
      (function statusLoop(){
        const n=new Date();
        const signal = 90 + Math.floor(Math.random() * 7);
        const time = n.toISOString().slice(11,19);
        if (!isAudio) {
          statusText.textContent = `ONLINE • NODO: ITZA-03 • SEÑAL: ${signal}% • ${time} UTC`;
        }
        setTimeout(statusLoop, 2000);
      })();

      // ─── Service Worker ───
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(r => console.log('◍ SW registrado:', r.scope))
          .catch(e => console.warn('◍ SW falló:', e));
      }
    })();

    // ─── SPA GitHub Pages fix ───
    (function(l){
      if(l.search[1]==='/'){
        var d=l.search.slice(1).split('&').map(s=>s.replace(/~and~/g,'&')).join('?');
        history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);
      }
    })(location);
  </script>
</body>
</html>
