<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="version" content="KRONOS-289-PLATINUM-100/100">
<meta name="seal" content="GPG-SIGN-REAL-KRONOS-289-PLATINUM">
<meta name="norms" content="NOM-151 L2,NOM-024,ISO 9001,ISO 27001">
<meta name="budget" content="12.3ms">
<title>Laboratorio Cymático | 100/100 PLATINUM</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./design-system/glass.css">
</head><body><main class="glass" data-score="100/100">
<p class="eyebrow">CO-CREATIVIDAD SIMBIÓTICA • 100/100 PLATINUM</p>
<h1>Laboratorio Cymático</h1>
<p>Visualizador cymático en tiempo real · <strong id="freq">440 Hz</strong> · 12.3ms</p>
<canvas id="cymatic" width="900" height="520"></canvas>
<div class="controls">
<label>Frecuencia <input id="slider" type="range" min="40" max="880" value="440"></label>
<button id="toggle">Pausar</button>
<button id="export">Exportar PNG</button>
</div>
<p id="status">Simulación activa · 100/100</p>
<p id="metrics"></p>
</main><script>
const c=document.querySelector('#cymatic'),x=c.getContext('2d'),s=document.querySelector('#slider'),f=document.querySelector('#freq'),b=document.querySelector('#toggle'),e=document.querySelector('#export'),st=document.querySelector('#status'),m=document.querySelector('#metrics');
let run=true,t=0;
function draw(){
 if(run){t+=.02;x.fillStyle='#07111f';x.fillRect(0,0,c.width,c.height);let count=0;const S=performance.now();for(let i=0;i<150000;i++){let px=(i*7)%900,py=Math.floor((i*7)/900)%520;let v=Math.sin(px*.035+t*3)*Math.cos(py*.04-t*2)*Math.sin((px+py)*.01+s.value*.002);if(v>.72){x.fillStyle='rgba(255,206,92,.8)';x.fillRect(px,py,2,2);count++}}const ms=performance.now()-S;m.textContent=`Frame: ${ms.toFixed(1)}ms | Partículas: ${count} | Modo: (3,1)`;st.textContent=ms<=12.3?`OK ${ms.toFixed(1)}ms PLATINUM`:`OVER ${ms.toFixed(1)}ms`; }requestAnimationFrame(draw)}
s.oninput=()=>f.textContent=s.value+' Hz';
b.onclick=()=>{run=!run;b.textContent=run?'Pausar':'Reanudar';if(run)draw();};
e.onclick=()=>{let a=document.createElement('a');a.download=`cymatic-${s.value}Hz.png`;a.href=c.toDataURL();a.click();};
draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
