<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KRONOS-28-ITZA ◍ 04:40 Gold Glass</title>
  <meta name="description" content="KRONOS-28-ITZA — Co-Creatividad Simbiótica y Respeto Digital. Mandala 04:40." />
  <meta name="theme-color" content="#07111f" />
  <meta name="color-scheme" content="dark" />
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  
  <!-- Canonical / Base -->
  <link rel="canonical" href="https://marcorojas17.github.io/Co-Creatividad-Simbiotica-y-Respeto-Digital/" />
  <base href="./" />
  
  <style>
    /* ─── Theme variables (fallback) ─── */
    :root {
      --bg: #07111f;
      --bg-deep: #040a14;
      --gold: #d6a84f;
      --gold-glow: #f2d18a;
      --text: #f5f7fb;
      --text-muted: #9aa8c2;
      --glass-bg: rgba(7,17,31,0.62);
      --glass-blur: 18px;
      --glass-border: 1px solid rgba(214,168,79,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-deep);
      color: var(--text);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(214,168,79,0.04) 0%, rgba(0,0,0,0) 60%),
                  radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.95) 100%);
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 48px 32px 32px;
      border-radius: 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: var(--glass-border);
      box-shadow: 0 0 0 1px rgba(214,168,79,0.08) inset,
                  0 24px 80px rgba(0,0,0,0.75),
                  0 0 60px rgba(214,168,79,0.06);
    }

    .kicker {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--gold);
      opacity: 0.9;
    }

    .title {
      margin-top: 28px;
      font-size: 30px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .title .gold {
      color: var(--gold);
      display: block;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .copy {
      margin-top: 22px;
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.7;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(18,18,18,0.7);
      color: #c8c8c8;
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.09em;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(214,168,79,0.5);
      color: var(--gold-glow);
    }
    .btn-primary {
      background: linear-gradient(180deg, #e7c65a 0%, #d6a84f 100%);
      color: #000;
      border-color: var(--gold);
      font-weight: 700;
      box-shadow: 0 6px 24px rgba(214,168,79,0.28);
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #f2d18a 0%, #e0bf5a 100%);
      box-shadow: 0 10px 32px rgba(214,168,79,0.4);
      color: #000;
    }
    .btn-sync {
      border-color: rgba(214,168,79,0.3);
      color: var(--gold);
    }
    .btn-sync:hover {
      border-color: var(--gold);
      background: rgba(214,168,79,0.1);
    }
    .btn-sync.active {
      background: rgba(214,168,79,0.15);
      border-color: var(--gold);
      color: var(--gold-glow);
    }

    .footer {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 9.5px;
      color: #5a6a7a;
      letter-spacing: 0.08em;
    }
    .footer .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #5cff7a;
      border-radius: 50%;
      box-shadow: 0 0 8px #5cff7a;
      animation: pulse 2s infinite;
    }
    .footer .dot.inactive {
      background: #444;
      box-shadow: none;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #sync-status {
      font-size: 9px;
      color: #5a6a7a;
      margin-top: 4px;
      transition: color 0.3s;
    }
    #sync-status.active {
      color: var(--gold);
    }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 24px; }
      .title { font-size: 24px; }
      .btn { padding: 10px 18px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <!-- Fondo cimático -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="vignette"></div>

  <!-- APP -->
  <main id="app" role="main" aria-labelledby="app-title">
    <div class="card">
      <div class="kicker" id="app-title">◍ CO-CREATIVIDAD SIMBIÓTICA</div>
      <div class="title">KRONOS-28-ITZA <span class="gold">04:40</span></div>
      <div class="copy">Respeto Digital. La autoridad tranquila.<br>El lienzo late al ritmo de la señal.</div>

      <div class="actions">
        <a class="btn btn-primary" href="./live3d.html" aria-label="Abrir lienzo cimático 3D">ENTRAR ◍ LIVE 3D</a>
        <a class="btn" href="./live.html" aria-label="Ver señal en vivo">LIVE</a>
        <button class="btn btn-sync" id="btn-sync" aria-label="Sincronizar ritmo con YouTube">◍ SINCRONIZAR</button>
      </div>

      <div class="footer">
        <span>
          <span class="dot" id="status-dot"></span>
          <span id="status-text">ONLINE • NODO: ITZA-03 • 440Hz</span>
        </span>
        <div id="sync-status">◍ Esperando sincronización...</div>
      </div>
    </div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    // ─── IMPORTS ───
    import { applyThemeToRoot, COLORS, GLASS, PERF, CYMATIC } from './theme.js';
    import { Engine } from './frequency_engine.js';
    import { trackFrame } from './data/timeseries.js';

    // ─── APLICAR TEMA ───
    applyThemeToRoot();

    // ─── DOM REFS ───
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const syncStatus = document.getElementById('sync-status');
    const btnSync = document.getElementById('btn-sync');

    // ─── AUDIO REACTIVE SYSTEM ───
    let audioCtx, analyser, dataArray, isAudio = false;
    let bassLevel = 1, midsLevel = 0;

    async function syncYouTubeTab() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.82;
        const audioOnly = new MediaStream(stream.getAudioTracks());
        if (audioOnly.getAudioTracks().length === 0) throw new Error('No audio track');
        audioCtx.createMediaStreamSource(audioOnly).connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isAudio = true;
        stream.getVideoTracks().forEach(t => t.stop());

        btnSync.textContent = '◍ SINCRONIZADO ✓';
        btnSync.classList.add('active');
        syncStatus.textContent = '◍ Sincronizado con YouTube — el ritmo late';
        syncStatus.className = 'active';
        statusDot.className = 'dot';
        statusText.textContent = 'ONLINE • RITMO ACTIVO • 440Hz';
        console.log('◍ Audio sincronizado desde pestaña de YouTube');
      } catch (e) {
        // Fallback a micrófono
        try {
          const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioCtx = new AudioContext();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          audioCtx.createMediaStreamSource(mic).connect(analyser);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          isAudio = true;
          btnSync.textContent = '◍ SINCRONIZADO (MIC)';
          btnSync.classList.add('active');
          syncStatus.textContent = '◍ Sincronizado por micrófono — coloca la música cerca';
          syncStatus.className = 'active';
          statusDot.className = 'dot';
          statusText.textContent = 'ONLINE • RITMO MIC • 440Hz';
          console.log('◍ Audio sincronizado por micrófono (fallback)');
        } catch (err) {
          alert('Necesitas permitir el audio para sincronizar el ritmo.');
          console.warn('◍ Error de audio:', err);
        }
      }
    }

    btnSync.addEventListener('click', syncYouTubeTab);

    // ─── FUNCIÓN DE RITMO ───
    function getBeat() {
      if (!isAudio || !analyser) return { b: 1, m: 0 };
      analyser.getByteFrequencyData(dataArray);
      const bass = dataArray.slice(2, 16).reduce((a, b) => a + b, 0) / 14 / 255;
      const mids = dataArray.slice(16, 90).reduce((a, b) => a + b, 0) / 74 / 255;
      bassLevel = bassLevel * 0.85 + bass * 0.15;
      midsLevel = midsLevel * 0.85 + mids * 0.15;
      return { b: 1 + bassLevel * 4.5, m: midsLevel };
    }

    // ─── CANVAS CIMÁTICO ───
    let W, H, dpr = Math.min(devicePixelRatio || 1, 2);
    let t = 0;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ─── LOOP DE DIBUJO ───
    function draw(now) {
      const start = performance.now();

      const beat = getBeat();
      t += 0.008 * beat.b;

      // Fondo
      ctx.fillStyle = '#040a14';
      ctx.fillRect(0, 0, W, H);

      const cx = W * 0.5;
      const cy = H * 0.52;
      ctx.save();

      // Ondas cimáticas usando chladniMode (3,1)
      const freq = Engine.base * beat.b;
      const step = 6;
      for (let i = 0; i < 40; i++) {
        const offset = i * 10;
        ctx.beginPath();
        const alpha = 0.04 - i * 0.0008;
        ctx.strokeStyle = `rgba(214,168,79,${Math.max(alpha, 0.005)})`;
        ctx.lineWidth = 0.6;
        let first = true;
        for (let px = -W * 0.6; px < W * 1.2; px += step) {
          const nx = px / W * 2;
          const ny = (i - 20) / 20 * 0.6;
          const val = Engine.getChladni(nx, ny, 3, 1, freq) * 0.7
                    + Math.sin((nx*nx + ny*ny) * 0.04 * beat.b - t * 2) * 0.3;
          const y = cy + val * 40 * beat.b * Math.exp(-Math.abs(nx) * 0.6);
          if (first) { ctx.moveTo(px, y); first = false; }
          else ctx.lineTo(px, y);
        }
        ctx.stroke();
      }

      // Anillos dorados (mandala 04:40)
      for (let j = 1; j <= 6; j++) {
        ctx.beginPath();
        const r = 70 + j * 60 + Math.sin(t * j * beat.b) * 10;
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(214,168,79,${0.04 / j * Math.min(beat.b, 1.4)})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }

      // Glow dorado con ritmo
      const glow = Math.min(beat.b * 0.12, 0.25);
      const grad = ctx.createRadialGradient(cx, cy - 40, 0, cx, cy - 40, W * 0.6);
      grad.addColorStop(0, `rgba(214,168,79,${glow})`);
      grad.addColorStop(0.3, `rgba(214,168,79,${glow * 0.3})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.restore();

      // ─── TELEMETRY ───
      const frameMs = performance.now() - start;
      trackFrame(frameMs);
      const budgetOk = frameMs <= PERF.frame_target_ms;
      if (!budgetOk && Math.random() < 0.01) {
        console.warn(`⚠️ Frame ${frameMs.toFixed(1)}ms > ${PERF.frame_target_ms}ms`);
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    // ─── STATUS DINÁMICO ───
    setInterval(() => {
      const now = new Date();
      const time = now.toISOString().slice(11, 19);
      if (!isAudio) {
        statusText.textContent = `ONLINE • NODO: ITZA-03 • ${time} UTC • 440Hz`;
      }
    }, 2000);

    // ─── SERVICE WORKER ───
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(r => console.log('◍ SW registrado:', r.scope))
        .catch(e => console.warn('◍ SW falló:', e));
    }

    // ─── SPA FIX para GitHub Pages ───
    (function(l) {
      if (l.search[1] === '/') {
        const d = l.search.slice(1).split('&').map(s => s.replace(/~and~/g, '&')).join('?');
        history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
      }
    })(window.location);

    console.log('◍ KRONOS 289 PLATINUM 04:40 Gold Glass — index.html cargado');
    console.log('🔹 Mandala:', CYMATIC.mandala);
    console.log('🔹 Budget:', PERF.frame_target_ms, 'ms');
    console.log('🔹 Gold:', COLORS.gold);
  </script>
</body>
</html>
