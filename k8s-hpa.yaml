apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cymatic-web
  labels:
    app: cymatic-web
    version: "289-PLATINUM"
    score: "100/100"
    seal: "KRONOS-289-PLATINUM-SEALED"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cymatic-web
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
