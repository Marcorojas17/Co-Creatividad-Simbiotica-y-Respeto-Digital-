name: KRONOS 289 PLATINUM SECURITY L2

on:
  push:
    paths:
      - 'data/theft_log.json'
      - 'security/**'
      - 'gpg_sign_engine.sh'

jobs:
  gpg-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Sign theft_log.json REAL SHA512
        run: |
          chmod +x gpg_sign_engine.sh
          ./gpg_sign_engine.sh
          SHA=$(sha512sum data/theft_log.json | awk '{print $1}')
          echo "SHA512=$SHA"
          echo "✅ SHA512 calculado: $SHA"
          
          # Firma REAL .asc
          gpg --armor --detach-sign data/theft_log.json
          ls -lh data/theft_log.json.asc
          echo "✅ Archivo firmado: data/theft_log.json.asc"
          cat data/theft_log.json.asc

      - name: Update chain NOM-151
        run: |
          echo "📋 NOM-151 Chain:"
          cat security/nom151_chain.json
          python audit.py

      - name: Commit signed artifacts
        run: |
          git config user.name "KRONOS-289-PLATINUM-BOT"
          git config user.email "kronos289@platinum.dev"
          git add data/theft_log.json data/theft_log.json.asc security/nom151_chain.json SEALO_CALIDAD.json
          git commit -m "chore: GPG-SIGN-REAL-KRONOS-289-PLATINUM NOM-151 L2 [skip ci]" || echo "📌 No hay cambios para commit"
          git push || echo "📌 No hay cambios para push"
