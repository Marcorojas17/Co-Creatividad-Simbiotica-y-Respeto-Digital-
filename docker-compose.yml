# KRONOS 289 PLATINUM 100/100 SEALED - 12.3ms budget
services:
  web:
    build:.
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - FRAME_TARGET_MS=12.3
      - BASE_FREQUENCY_HZ=440
      - SCORE=100/100
      - LEVEL=PLATINUM
      - SEAL=GPG-SIGN-REAL-KRONOS-289-PLATINUM
      - GPG_TTY=/dev/console
    volumes:
      -./apps/web:/app/apps/web
      -./core-dsp:/app/core-dsp
      -./security:/app/security
      -./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      score: "100/100"
      level: "PLATINUM"
      budget: "12.3ms"
