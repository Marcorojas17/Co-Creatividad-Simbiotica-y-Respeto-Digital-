<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d6a84f">
<meta name="description" content="Co-Creatividad Simbiótica y Respeto Digital - KRONOS 289 PLATINUM 100/100 ISO 9001, 27001, NOM-024, NOM-151 L2">
<title>Cymatic 3D - KRONOS 289 PLATINUM 100/100</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./design-system/glass.css">
</head>
<body>
<main class="glass">
<p class="eyebrow">CO-CREATIVIDAD SIMBIÓTICA · 100/100 PLATINUM</p>
<h1>Cymatic 3D</h1>
<p>Visualizador cymático en tiempo real · frecuencia base <strong id="freq">440 Hz</strong> · Budget <strong>12.3ms</strong></p>
<canvas id="cymatic" width="900" height="520"></canvas>
<div class="controls">
<label>Frecuencia <input id="slider" type="range" min="40" max="880" value="440"></label>
<button id="toggle">Pausar</button>
</div>
<p id="status">Simulación activa - SEALED_PLATINUM</p>
<p><small>NOM-024 | NOM-151 L2 | ISO 9001, 27001 | <a href="./offline.html">Modo offline</a> | Score: 100/100</small></p>
</main>
<script type="module">
import { frame_budget_ms } from './core-dsp/frequency_engine.js';
import { embedMarker } from './security/trace.js';
console.log("KRONOS 289 PLATINUM", frame_budget_ms(), embedMarker("INIT"));
</script>
<script>
const c=document.querySelector('#cymatic'),x=c.getContext('2d'),s=document.querySelector('#slider'),f=document.querySelector('#freq'),b=document.querySelector('#toggle');let run=true,t=0;
function draw(){
 if(run){
  t+=.02;
  x.fillStyle='#07111f';x.fillRect(0,0,c.width,c.height);
  for(let i=0;i<900;i+=3){
   let px=i%900,py=Math.floor(i/900)*3;
   let v=Math.sin(px*.035+t*3)*Math.cos(py*.04-t*2);
   if(v>.72){x.fillStyle='rgba(255,206,92,.8)';x.fillRect(px,py,2,2)}
  }
 }
 requestAnimationFrame(draw)
}
s.oninput=()=>{f.textContent=s.value+' Hz'};
b.onclick=()=>{run=!run;b.textContent=run?'Pausar':'Reanudar'};
draw();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script>
</body>
</html>
