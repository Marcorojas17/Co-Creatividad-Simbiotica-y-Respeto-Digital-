<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LIVE ◍ KRONOS-28-ITZA</title>
  <meta name="description" content="KRONOS-28-ITZA-CYMATIC-ELITE — Señal en vivo. La autoridad tranquila." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <base href="./" />
  <style>
    :root{--bg:#070708;--fg:#ececec;--muted:#8a8a8a;--accent:#d4af37;--border:rgba(255,255,255,0.08)}
    *{margin:0;padding:0;box-sizing:border-box} html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;overflow:hidden}
    #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
    #app{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;padding:20px}
    .card{width:100%;max-width:560px;border-radius:28px;padding:40px 32px;background:linear-gradient(180deg, rgba(26,26,26,0.78), rgba(14,14,14,0.88));backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);border:1px solid var(--border);box-shadow:0 0 0 1px rgba(212,175,55,0.12) inset, 0 24px 80px rgba(0,0,0,0.7)}
    .kicker{font-size:10px;letter-spacing:0.22em;color:var(--accent);text-align:center}
    .title{margin-top:18px;font-size:22px;text-align:center;line-height:1.2}
    .title b{color:var(--accent)}
    .status{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;font-size:11px;color:var(--muted);letter-spacing:0.08em}
    .dot{width:7px;height:7px;background:#5cff7a;border-radius:50%;box-shadow:0 0 10px #5cff7a;flex-shrink:0}
    .log{margin-top:24px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px;font-size:11.5px;line-height:1.6;color:#9a9a9a;max-height:240px;overflow:auto}
    .log b{color:var(--accent)}
    .actions{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{border:1px solid rgba(255,255,255,0.12);background:rgba(20,20,20,0.9);color:#bbb;padding:12px 22px;border-radius:999px;font-size:11px;letter-spacing:0.08em;text-decoration:none;transition:.25s;font-family:inherit;cursor:pointer}
    .btn:hover{border-color:var(--accent);color:var(--accent)} .btn-primary{background:var(--accent);color:#000;font-weight:700;border-color:var(--accent)}
    .btn-primary:hover{background:#e2c05a;color:#000}
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <main id="app" role="main" aria-labelledby="live-title">
    <div class="card">
      <div class="kicker" id="live-title">◍ LIVE — SEÑAL EN VIVO</div>
      <div class="title">KRONOS-28-ITZA <b>v0.4.0</b><br><span style="font-size:13px;color:#777">Co-Creatividad Simbiótica</span></div>
      <div class="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="s">init — checking signal...</span>
      </div>
      <div class="log" id="log" role="log" aria-live="polite" aria-atomic="false">
        ◍ [00:00] boot → kronos-28-itza v0.4.0<br>
        ◍ [00:01] respeto digital → autoridad tranquila<br>
        ◍ [00:02] live → esperando entrada...
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="./live3d.html" aria-label="Abrir lienzo cimático 3D">ENTRAR ◍ LIVE 3D</a>
        <a class="btn" href="./index.html" aria-label="Volver al inicio">INDEX</a>
      </div>
    </div>
  </main>

  <script>
    // ─── Fondo cimático (anillos sutiles) ───
    (()=>{
      const c=document.getElementById('bg'), x=c.getContext('2d');
      let W,H,dpr=Math.min(devicePixelRatio||1,2), t=0;
      function R(){
        W=innerWidth; H=innerHeight;
        c.width=W*dpr; c.height=H*dpr;
        c.style.width=W+'px'; c.style.height=H+'px';
        x.setTransform(dpr,0,0,dpr,0,0);
      }
      R(); addEventListener('resize',R);
      function D(){
        t+=0.004;
        x.fillStyle='#070708';
        x.fillRect(0,0,W,H);
        const cx=W*0.5, cy=H*0.5;
        for(let j=1;j<=4;j++){
          x.beginPath();
          x.arc(cx, cy, 90+j*80+Math.sin(t*j)*8, 0, Math.PI*2);
          x.strokeStyle=`rgba(212,175,55,${0.06/j})`;
          x.lineWidth=0.7;
          x.stroke();
        }
        const g=x.createRadialGradient(cx,cy,0,cx,cy,W*0.6);
        g.addColorStop(0,'rgba(212,175,55,0.12)');
        g.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=g;
        x.fillRect(0,0,W,H);
        requestAnimationFrame(D);
      }
      D();
    })();

    // ─── Estado y log en vivo ───
    (()=>{
      const s=document.getElementById('s');
      const l=document.getElementById('log');

      function addLog(msg){
        const d=new Date().toISOString().slice(11,19);
        l.innerHTML += `<br>◍ [${d}] ${msg}`;
        l.scrollTop = l.scrollHeight;
      }

      function updateStatus(){
        const now = new Date().toISOString().slice(11,19);
        const latency = 20 + Math.floor(Math.random() * 15);
        s.textContent = `online • latency ${latency}ms • node: kronos-live • ${now} UTC`;
      }

      updateStatus();
      setInterval(updateStatus, 1000);

      // Logs temporizados (simulan eventos)
      setTimeout(() => addLog('<b>signal</b> → estable • respeto digital activo'), 1200);
      setTimeout(() => addLog('<b>lienzo</b> → listo • entra a LIVE 3D'), 2400);
      setTimeout(() => addLog('<b>nodo</b> → ITZA-03 sincronizado'), 3600);

      // Service Worker (con trazabilidad)
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(r => console.log('◍ SW registrado:', r.scope))
          .catch(e => console.warn('◍ SW falló:', e));
      }
    })();

    // ─── SPA GitHub Pages fix (opcional, por consistencia) ───
    (function(l){
      if(l.search[1]==='/'){
        var d=l.search.slice(1).split('&').map(s=>s.replace(/~and~/g,'&')).join('?');
        history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);
      }
    })(location);
  </script>
</body>
</html>
