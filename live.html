<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cymatic Live</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./design-system/glass.css"></head><body><main class="glass"><p class="eyebrow">CO-CREATIVIDAD SIMBIÓTICA</p><h1>Cymatic Live</h1><p>Visualizador cymático en tiempo real · frecuencia base <strong id="freq">440 Hz</strong></p><canvas id="cymatic" width="900" height="520"></canvas><div class="controls"><label>Frecuencia <input id="slider" type="range" min="40" max="880" value="440"></label><button id="toggle">Pausar</button></div><p id="status">Simulación activa</p></main><script src="./core-dsp/frequency_engine.js"></script><script src="./drivers/chladni_plate.py" type="text/plain"></script><script>const c=document.querySelector('#cymatic'),x=c.getContext('2d'),s=document.querySelector('#slider'),f=document.querySelector('#freq'),b=document.querySelector('#toggle');let run=true,t=0;function draw(){if(run){t+=.02;x.fillStyle='#07111f';x.fillRect(0,0,c.width,c.height);for(let i=0;i<900;i+=3){let px=i%900,py=Math.floor(i/900)*3;let v=Math.sin(px*.035+t*3)*Math.cos(py*.04-t*2);if(v>.72){x.fillStyle='rgba(255,206,92,.8)';x.fillRect(px,py,2,2)}}}requestAnimationFrame(draw)}s.oninput=()=>{f.textContent=s.value+' Hz'};b.onclick=()=>{run=!run;b.textContent=run?'Pausar':'Reanudar'};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
