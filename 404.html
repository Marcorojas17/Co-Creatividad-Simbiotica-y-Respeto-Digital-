<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Co-Creatividad Simbiótica ◍</title>
  <meta name="description" content="KRONOS-28-ITZA-CYMATIC-ELITE — Redirect" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <base href="./" />
  <style>
    :root { --bg:#070708; --fg:#ececec; --muted:#9a9a9a; --accent:#d4af37; --accent-2:#f0d27a; --border:rgba(255,255,255,0.09); }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;overflow:hidden}
    #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
    #vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 50%, rgba(212,175,55,0.06) 0%, rgba(0,0,0,0) 60%), radial-gradient(100% 100% at 50% 100%, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.95) 100%)}
    #app{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;padding:20px;text-align:center}
   .card{width:100%;max-width:520px;padding:48px 32px 32px;border-radius:28px;background:linear-gradient(180deg, rgba(26,26,26,0.78) 0%, rgba(14,14,14,0.84) 100%);backdrop-filter: blur(20px) saturate(1.15);-webkit-backdrop-filter: blur(20px) saturate(1.15);border:1px solid var(--border);box-shadow: 0 0 0 1px rgba(212,175,55,0.12) inset, 0 24px 80px rgba(0,0,0,0.75), 0 0 60px rgba(212,175,55,0.08);}
   .kicker{font-size:11px;letter-spacing:0.2em;color:var(--accent)}
   .title{margin-top:28px;font-size:30px;line-height:1.05;font-weight:600}
   .title.gold{color:var(--accent);display:block;margin-top:6px;font-weight:500}
   .copy{margin-top:22px;color:var(--muted);font-size:13.5px;line-height:1.7}
   .actions{margin-top:32px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
   .btn{appearance:none;border:1px solid rgba(255,255,255,0.14);background:rgba(18,18,18,0.9);color:#c8c8c8;padding:14px 26px;border-radius:999px;font-size:12px;letter-spacing:0.09em;font-family:inherit;cursor:pointer;text-decoration:none;transition:.25s}
   .btn-primary{background:linear-gradient(180deg, #e7c65a 0%, #d4af37 100%);color:#000;border-color:#d4af37;font-weight:700;box-shadow:0 6px 24px rgba(212,175,55,0.28)}
   .footer{margin-top:28px;font-size:9.5px;color:#5a5a5a;letter-spacing:0.08em}
  </style>
  <script>
    // SPA GitHub Pages fix — redirige /live y /live3d
    (function(){
      var l=location, p=l.pathname;
      if(p.includes('/Co-Creatividad-Simbiotica-y-Respeto-Digital/live')){
        var dest = p.includes('live3d') ? './live3d.html' : './live.html';
        sessionStorage.setItem('kronos_redirect', p);
        location.replace(dest + l.search + l.hash);
      }
    })();
  </script>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="vignette"></div>
  <div id="app">
    <div class="card">
      <div class="kicker">◍ CO-CREATIVIDAD SIMBIÓTICA</div>
      <div class="title">KRONOS-28-ITZA <span class="gold">v0.4.0</span></div>
      <div class="copy">Respeto Digital. La autoridad tranquila.<br>Redirigiendo al lienzo... La señal está en vivo.</div>
      <div class="actions">
        <a class="btn btn-primary" href="./live3d.html">ENTRAR ◍ LIVE 3D</a>
        <a class="btn" href="./index.html">INICIO</a>
      </div>
      <div class="footer"><span id="status">◍ 404 → fix → 200 • v0.4.0</span></div>
    </div>
  </div>
  <script>
    (()=>{const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2),t=0;
    function R(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.scale(dpr,dpr);}R();addEventListener('resize',R);
    function D(){t+=0.004;x.fillStyle='#070708';x.fillRect(0,0,W,H);const cx=W*0.5,cy=H*0.52;x.save();
    for(let i=0;i<28;i++){x.beginPath();x.strokeStyle=`rgba(212,175,55,${0.09-i*0.0025})`;x.lineWidth=0.6;for(let px=-W*0.6;px<W*1.2;px+=8){const y=cy+Math.sin(px*0.008+t*1.2+i*0.35)*(18+i*1.8)*Math.exp(-Math.pow((px-W*0.5)/(W*0.55),2)*1.2)+(i-14)*12;if(px===-W*0.6)x.moveTo(px,y);else x.lineTo(px,y);}x.stroke();}
    for(let j=1;j<=6;j++){x.beginPath();x.arc(cx,cy,80+j*70+Math.sin(t*j)*6,0,Math.PI*2);x.strokeStyle=`rgba(212,175,55,${0.07/j})`;x.lineWidth=0.7;x.stroke();}
    const g=x.createRadialGradient(cx,cy-40,0,cx,cy-40,W*0.7);g.addColorStop(0,'rgba(212,175,55,0.16)');g.addColorStop(0.25,'rgba(212,175,55,0.06)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    const g2=x.createRadialGradient(W*0.15,H*0.75,0,W*0.15,H*0.75,W*0.5);g2.addColorStop(0,'rgba(212,175,55,0.12)');g2.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g2;x.fillRect(0,0,W,H);
    x.restore();requestAnimationFrame(D);}D();})();
  </script>
</body>
</html>
